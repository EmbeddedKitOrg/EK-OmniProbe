name: Bug 反馈
description: 报告一个功能异常
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。嵌入式调试问题高度依赖硬件环境，请尽量把探针型号、目标芯片和固件情况写清楚，否则很难复现。

  - type: dropdown
    id: workbench
    attributes:
      label: 涉及哪个工作台
      options:
        - 烧录
        - RTT
        - 串口
        - 日志分析
        - 控制面板
        - 蓝牙
        - 调试
        - 应用整体 / 启动 / 更新
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望是什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 RTT 工作台
        2. 选择探针 ...
        3. 点击「连接 RTT」
        4. 出现 ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 见「设置 → 工具 → 关于作者」，或安装包文件名
      placeholder: '2.0.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true

  - type: input
    id: probe
    attributes:
      label: 调试探针
      description: 型号与固件版本；仅使用串口 / TCP / UDP / BLE 时填「不涉及」
      placeholder: 'CMSIS-DAP (DAPLink v0257) / ST-Link V2 / 不涉及'

  - type: input
    id: target
    attributes:
      label: 目标芯片
      placeholder: 'GD32F470ZK / STM32F103C8 / 不涉及'

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 展开底部日志面板，把相关输出贴进来（会自动按代码块格式化）
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已确认使用的是最新版本
          required: true
        - label: 我已搜索过现有 issue，没有重复
          required: true
