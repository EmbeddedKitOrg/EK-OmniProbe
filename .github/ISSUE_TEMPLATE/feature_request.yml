name: 功能建议
description: 提出新功能或改进想法
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        本项目遵循 KISS / YAGNI 原则（见 AGENTS.md），会优先考虑「当前明确需要」的能力。请说明实际使用场景，而不只是功能清单。

  - type: dropdown
    id: workbench
    attributes:
      label: 涉及哪个工作台
      options:
        - 烧录
        - RTT
        - 串口
        - 日志分析
        - 控制面板
        - 蓝牙
        - 调试
        - 应用整体
        - 新工作台
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述实际遇到的场景，而不是直接描述想要的按钮
      placeholder: '调试 IMU 时需要同时看三轴波形和姿态，目前必须来回切换视图……'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现在你是怎么绕过的
      description: 当前用什么工具或步骤替代？这有助于判断优先级

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
